name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: muse
          POSTGRES_DB: agnts_muse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muse" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && (cd ledger/pgledger && go vet ./...)
      - name: test
        run: go test -race -count=2 -coverprofile=coverage.out ./...
      - name: test pgledger
        working-directory: ledger/pgledger
        env:
          AGNTS_MUSE_TEST_DATABASE_URL: postgres://muse:muse@localhost:5432/agnts_muse_test?sslmode=disable
        run: go test -race ./...
      - name: fuzz smoke
        run: |
          go test -run '^$' -fuzz FuzzClientDispatch -fuzztime 20s ./msp
          go test -run '^$' -fuzz FuzzParse -fuzztime 10s ./money
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
